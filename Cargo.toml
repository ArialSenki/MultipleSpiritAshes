[package]
name = "multiple-spirit-ashes"
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Multiple Spirit Ashes (Nexus 11158). Built into NativeTweaks.dll as a static
# library (the Hub starts it and drives its settings, see src/lib.rs, nt_msa_*)
# and, through standalone/, as the standalone MultipleSpiritAshes.dll.
# fromsoftware-rs (with the WW 2.7.2.0 and JP 2.7.2.1 RVA bundles) is vendored in vendor/.
[dependencies]
eldenring = { path = "vendor/fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "vendor/fromsoftware-rs/crates/shared" }
pelite = "0.10"
[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[lib]
name = "multiple_spirit_ashes"
# staticlib: linked into NativeTweaks.dll; rlib: used by standalone/ (MultipleSpiritAshes.dll).
crate-type = ["staticlib", "rlib"]

[profile.release]
debug = 2
strip = "none"
