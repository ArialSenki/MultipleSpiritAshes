[MultipleSpiritAshes]
; Multiple Spirit Ashes 0.2.0 - Elden Ring 1.17.2 (2.7.2.0) and 1.17.1 (2.7.1.0).
; Changes apply when the game starts.

; true: summon several spirit ashes at once. false: the game's own behaviour.
Enabled=true

; How many spirit ashes can be summoned together (2-20). A summon with several
; spirits counts as one. The HUD shows up to 6 rows; many ashes can lower performance.
MaxActiveAshes=8

; FP and HP every spirit ash costs, in % of its normal cost (0-300).
; 0 = free, 100 = normal.
AshCostPercent=100

; FP each ash costs when another one is already summoned, in % of its own cost
; (0-200). 100 = normal cost; the first ash always costs its normal FP.
ExtraAshCostPercent=100

; Each summoned ash deals this % less damage for every other ash summoned
; (0-20, never below 25 % of its damage). 0 = full damage.
DamageLossPerExtraAshPercent=0

; true: one compact row per ash on the HUD (name and HP, up to 6; "xN" for
; groups, "+N" when there are more). false: the HUD is left untouched and the
; game's own spirit panel stays (for Seamless Co-op or other HUD mods).
HudRows=true

; true: every summoning monument reaches its whole area, so ashes work wherever
; the game allows spirits and are no longer dismissed for walking away from it
; (they still need an area where summoning is allowed).
SummonAnywhere=true

; true: a monument tied to a boss no longer dismisses your ashes when the boss
; dies, and stays usable afterwards.
KeepAshesAfterBoss=true

; true: a fallen ash can be summoned again without resting at a grace.
ResummonWithoutRest=true

; The three monument rules above work together and are on by default; they apply
; after the area reloads (rest at a grace).

; Optional key that dismisses every summoned ash while the game window is in
; front: F1-F24, a letter or digit, or a virtual-key code such as 0x74.
; Empty = no key.
DismissAllKey=

; Writes MultipleSpiritAshes.log next to the DLL.
LogEnabled=false
